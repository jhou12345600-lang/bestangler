const SAVE_KEY = 'bestangler.save.v1';

function freshSave() {

}

function load() {
  try { const raw = localStorage.getItem(SAVE_KEY); if (raw) S = Object.assign(freshSave(), JSON.parse(raw)); } catch (e) { /* storage blocked: play without saving */ }
  if (S.today.date !== today()) S.today = { date: today(), list: [] };
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } if (typeof FB !== 'undefined') FB.queueSave(); }
const lvFromEp = ep => { let lv = 1; while (ep >= epForLv(lv + 1)) lv++; return lv; };
function epForLv(lv) { return lv <= 1 ? 0 : Math.round(60 * Math.pow(lv - 1, 1.55)); }
const LV = () => lvFromEp(S.ep);

/* ---------------- assets ---------------- */
const A = { man: null, tex: {}, pending: {}, atlas: [] };
function loadImg(src) {
  return new Promise((res, rej) => { const i = new Image(); i.decoding = 'async'; i.onload = () => res(i); i.onerror = () => rej(new Error('load ' + src)); i.src = src; });
}
function texKey(kind, key) { return kind + ':' + key; }
function ensure(list) { // list of 'img:key' | 'anim:key' | 'atlas:i'
  return Promise.all(list.map(id => {
    if (A.tex[id]) return A.tex[id];
    if (A.pending[id]) return A.pending[id];
    const [kind, key] = [id.slice(0, id.indexOf(':')), id.slice(id.indexOf(':') + 1)];
    let src;
    if (kind === 'img') src = A.man.img[key] && A.man.img[key].f;
    else if (kind === 'anim') src = A.man.anim[key] && A.man.anim[key].f;
    else if (kind === 'atlas') src = A.man.atlas[+key];
    if (!src) return Promise.resolve(null);
    return (A.pending[id] = loadImg(src).then(im => (A.tex[id] = im)).catch(() => null));
  }));
}
async function ensureProgress(list, onp) {
  let done = 0; onp && onp(0);
  await Promise.all(list.map(id => ensure([id]).then(() => { done++; onp && onp(done / list.length); })));
}

/* ---------------- drawing helpers ---------------- */
function img(key, x, y, o = {}) {
  const m = A.man.img[key], t = A.tex['img:' + key];
  if (!m || !t) return null;
  const s = o.s ?? 1, w = (o.w ?? m.w) * (o.w ? 1 : s), h = (o.h ?? m.h) * (o.h ? 1 : s);
  const dx = x - w * (o.ax ?? 0), dy = y - h * (o.ay ?? 0);
  if (o.a !== undefined) { ctx.globalAlpha = o.a; }
  if (o.flip) { ctx.save(); ctx.translate(dx + w, dy); ctx.scale(-1, 1); ctx.drawImage(t, 0, 0, w, h); ctx.restore(); }
  else ctx.drawImage(t, dx, dy, w, h);
  if (o.a !== undefined) ctx.globalAlpha = 1;
  return { x: dx, y: dy, w, h };
}
function uiSize(key) { const u = A.man.ui[key]; return u ? { w: u.w / u.s, h: u.h / u.s } : { w: 0, h: 0 }; }
function ui(key, x, y, o = {}) {
  const u = A.man.ui[key]; if (!u) return null;
  const t = A.tex['atlas:' + u.a];
  const s = o.s ?? 1, w = (o.w ?? u.w / u.s * s), h = (o.h ?? u.h / u.s * s);
  const dx = x - w * (o.ax ?? 0), dy = y - h * (o.ay ?? 0);
  if (!t) return { x: dx, y: dy, w, h };
  if (o.a !== undefined) ctx.globalAlpha = o.a;
  if (o.crop !== undefined) { // horizontal fill 0..1 from the left
    const c = clamp(o.crop, 0, 1); if (c > 0) ctx.drawImage(t, u.x, u.y, u.w * c, u.h, dx, dy, w * c, h);
  } else if (o.flip) { ctx.save(); ctx.translate(dx + w, dy); ctx.scale(-1, 1); ctx.drawImage(t, u.x, u.y, u.w, u.h, 0, 0, w, h); ctx.restore(); }
  else ctx.drawImage(t, u.x, u.y, u.w, u.h, dx, dy, w, h);
  if (o.a !== undefined) ctx.globalAlpha = 1;
  return { x: dx, y: dy, w, h };
}
// Draw frame i of an animation. (x,y) is where the frame's anchor point lands; anchor in logical frame coords.
function frame(key, i, x, y, o = {}) {
  const m = A.man.anim[key], t = A.tex['anim:' + key];
  if (!m || !t) return false;
  i = ((Math.floor(i) % m.n) + m.n) % m.n;

  lose(why) {

  /* ----- input / controls ----- */

  update(dt) {

function renameModal() {
  const m = {

      });

    },
    place() { // keep the text box over the board, in CSS pixels
      const r = stage.getBoundingClientRect(), k = r.width / LW;
      nickEl.style.left = (360 - 200) * k + 'px'; nickEl.style.top = (548 - 34) * k + 'px';
      nickEl.style.width = 400 * k + 'px'; nickEl.style.height = 68 * k + 'px';
      nickEl.style.fontSize = Math.max(16, 30 * k) + 'px';
    },
    showInput() {
      nickEl.value = S.name; nickEl.style.display = 'block'; m.place();
      nickEl.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); m.commit(); } if (e.key === 'Escape') m.close(); };
      setTimeout(() => { try { nickEl.focus(); nickEl.select(); } catch (e) {} }, 30);
    },
    commit() {
      const v = cleanName(nickEl.value, '');
      if (!v) { say('名稱不能空白'); return; }
      S.name = v; save(); NET.saveProfile(); NET.lastJson = '';
      m.close(); openModal(messageModal(`名稱已改為「${v}」`, '修改名稱'));
    },
    close() { nickEl.style.display = 'none'; nickEl.blur(); nickEl.onkeydown = null; closeModal(m); },
  };
  return m;
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let last = performance.now(), DTF = 1 / 60;
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; DTF = dt; T += dt;
  ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.clearRect(0, 0, LW, LH);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ACTIVE_LAYER = modals.length ? 1 : 0;
  if (toast.t > 0) toast.t -= dt;
  NET.update(dt);
  if (scene) {
    LAYER = 0;
    if (!modals.length || scene !== pond) scene.update(dt);
    else if (scene === pond && !['idle', 'aim'].includes(pond.st)) scene.update(dt); // a fish keeps fighting behind a popup
    scene.draw();
  }
  if (scene && scene !== titleScene) NET.drawFeed();
  LAYER = 1;
  for (const m of modals) { m.t += dt; }
  if (modals.length) modals[modals.length - 1].draw();
  if (loading.on) {
    dim(.6);
    text(loading.msg, 360, 600, { size: 32, align: 'center', weight: 900, color: '#fff' });
    roundRect(160, 650, 400, 18, 9); ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fill();
    roundRect(160, 650, 400 * loading.p, 18, 9); ctx.fillStyle = '#8ff1ff'; ctx.fill();
  }
  // scene fade
  if (fadeDir) {
    fade = clamp(fade + dt * 3.2 * fadeDir, 0, 1);
    if (fade >= 1 && nextScene) {
      if (scene && scene.exit) scene.exit();
      const [sc, arg] = nextScene; nextScene = null; scene = sc; modals.length = 0; nickEl.style.display = 'none'; sc.enter(arg); fadeDir = -1;
    }
    if (fade <= 0 && fadeDir === -1) fadeDir = 0;
  }
  if (fade > 0) { ctx.fillStyle = `rgba(3,14,16,${fade})`; ctx.fillRect(0, 0, LW, LH); }
  P.justDown = false; P.justUp = false;
  if (!P.down && P.cap && !P.justUp) P.cap = null;
  requestAnimationFrame(loop);
}

/* ---------------- boot ---------------- */
(async function boot() {
  load(); resize();
  try { A.man = await (await fetch('assets.json')).json(); }
  catch (e) { bootEl.textContent = '素材讀取失敗，請重新整理頁面。'; return; }
  water.init();
  NET.init();
  await ensure(['img:cover-bg', 'atlas:0', 'atlas:1', 'atlas:2', 'atlas:3', 'anim:loadreel']);
  bootEl.hidden = true;
  scene = titleScene; titleScene.enter();
  requestAnimationFrame(t => { last = t; loop(t); });
  const first = ['img:lobby-map', 'img:lobby-bg-cloud1', 'img:lobby-bg-cloud2', 'img:lobby-bg-cloud3', 'anim:bird', 'anim:missionfx', ...A.man.atlas.map((_, i) => 'atlas:' + i), 'img:pond1-bg-water', 'img:pond1-bg-top', 'img:pond1-wood-grass', 'img:girl-idle', 'img:girl-fight', 'img:girl-shadow'];
  await ensureProgress(first, v => titleScene.p = v);
  try { await document.fonts.ready; } catch (e) {}
  titleScene.ready = true;
})();
