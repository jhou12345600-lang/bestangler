const SAVE_KEY = 'bestangler.save.v1';
const today = () => new Date().toISOString().slice(0, 10);
function freshSave() {
  return {
    name: '神釣手', ep: 0, gold: 20, silver: 500, firstRun: true,
    owned: { rod: ['12feet'], line: ['0.4'], float: ['ball'], lure: [] },

    char: 'girl', uw: true, blocked: {}, gifts: { date: today(), n: 0 },
  };
}
let S = freshSave();
function load() {
  try { const raw = localStorage.getItem(SAVE_KEY); if (raw) S = Object.assign(freshSave(), JSON.parse(raw)); } catch (e) { /* storage blocked: play without saving */ }
  if (S.today.date !== today()) S.today = { date: today(), list: [] };
}
// A cloud save is a JSON string. A save edited by hand in the Firebase console can come back as an object
// (RTDB turns arrays into objects), so accept both and repair the shape; the next save writes a string again.
function parseSave(v) {
  const o = typeof v === 'string' ? JSON.parse(v) : v && typeof v === 'object' ? v : null;
  if (!o) return null;
  const arr = a => Array.isArray(a) ? a.filter(x => x != null) : a && typeof a === 'object' ? Object.values(a).filter(x => x != null) : [];
  o.owned = o.owned || {}; for (const k of ['rod', 'line', 'float', 'lure']) o.owned[k] = arr(o.owned[k]);
  if (!o.owned.rod.length) o.owned.rod = ['12feet']; if (!o.owned.line.length) o.owned.line = ['0.4']; if (!o.owned.float.length) o.owned.float = ['ball'];
  if (o.today) o.today.list = arr(o.today.list);
  if (Array.isArray(o.bet)) o.bet = Object.fromEntries(o.bet.map((v, i) => [i, v]).filter(([, v]) => v != null));
  for (const k of ['bait', 'records', 'blocked', 'equip']) if (!o[k] || typeof o[k] !== 'object' || Array.isArray(o[k])) delete o[k];
  return o;
}

function loadImg(src) {
  return new Promise((res, rej) => { const i = new Image(); i.decoding = 'async'; i.onload = () => res(i); i.onerror = () => rej(new Error('load ' + src)); i.src = src; });
}
function texKey(kind, key) { return kind + ':' + key; }
function ensure(list) { // list of 'img:key' | 'anim:key' | 'atlas:i'
  return Promise.all(list.map(id => {
    if (A.tex[id]) return A.tex[id];
    if (A.pending[id]) return A.pending[id];
    const [kind, key] = [id.slice(0, id.indexOf(':')), id.slice(id.indexOf(':') + 1)];
    let src;
    if (kind === 'img') src = A.man.img[key] && A.man.img[key].f;
    else if (kind === 'anim') src = A.man.anim[key] && A.man.anim[key].f;
    else if (kind === 'atlas') src = A.man.atlas[+key];
    if (!src) return Promise.resolve(null);
    return (A.pending[id] = loadImg(src).then(im => (A.tex[id] = im)).catch(() => null));
  }));
}
async function ensureProgress(list, onp) {
  let done = 0; onp && onp(0);
  await Promise.all(list.map(id => ensure([id]).then(() => { done++; onp && onp(done / list.length); })));
}

/* ---------------- drawing helpers ---------------- */
function img(key, x, y, o = {}) {
  const m = A.man.img[key], t = A.tex['img:' + key];
  if (!m || !t) return null;
  const s = o.s ?? 1, w = (o.w ?? m.w) * (o.w ? 1 : s), h = (o.h ?? m.h) * (o.h ? 1 : s);
  const dx = x - w * (o.ax ?? 0), dy = y - h * (o.ay ?? 0);
  if (o.a !== undefined) { ctx.globalAlpha = o.a; }
  if (o.flip) { ctx.save(); ctx.translate(dx + w, dy); ctx.scale(-1, 1); ctx.drawImage(t, 0, 0, w, h); ctx.restore(); }
  else ctx.drawImage(t, dx, dy, w, h);
  if (o.a !== undefined) ctx.globalAlpha = 1;
  return { x: dx, y: dy, w, h };
}
function uiSize(key) { const u = A.man.ui[key]; return u ? { w: u.w / u.s, h: u.h / u.s } : { w: 0, h: 0 }; }
function ui(key, x, y, o = {}) {
  const u = A.man.ui[key]; if (!u) return null;

  onlineMap: {}, pondMap: {}, pondId: 0, pondRef: null, mePond: null, meOnline: null, lastOnline: '', lastEm: {},
  saveT: null, dirty: false, joinT: 0, listening: false, refs: [],
  available() {
    const c = window.FIREBASE_CONFIG;
    return !!(c && c.apiKey && !/YOUR_|請填/.test(c.apiKey) && c.databaseURL && window.firebase && firebase.auth && firebase.database);
  },
  init() {
    this.cfg = window.FIREBASE_CONFIG;
    firebase.initializeApp(this.cfg);
    this.auth = firebase.auth(); this.db = firebase.database();
    const em = this.cfg.emulator;
    if (em) { this.auth.useEmulator(em.auth); this.db.useEmulator(em.host, em.dbPort); }
    this.db.ref('.info/serverTimeOffset').on('value', s => { this.offset = s.val() || 0; });
    this.db.ref('.info/connected').on('value', s => { NET.connected = !!s.val(); if (NET.connected && this.user) this.announce(); });
    // a returning player is still signed in on this device
    const off = this.auth.onAuthStateChanged(u => { this.restored = u || null; off(); });
    addEventListener('visibilitychange', () => { if (document.hidden) this.flushSave(); });
  },
  now() { return Date.now() + this.offset; },
  email(id) { return id.toLowerCase() + '@player.bestangler.app'; },
  accountName() { const u = this.user || this.restored; if (!u) return ''; if (u.isAnonymous) return '訪客'; return (u.email || '').split('@')[0]; },
  // ---------- accounts
  checkId(id) { return /^[A-Za-z0-9_]{4,16}$/.test(id) ? null : '帳號需為 4–16 個英文字母、數字或底線。'; },
  async register(id, pw, mail) {
    const cred = await this.auth.createUserWithEmailAndPassword(this.email(id), pw);
    await this.db.ref('users/' + cred.user.uid + '/profile').set({ id, mail: mail || '', created: firebase.database.ServerValue.TIMESTAMP });
    return cred.user;
  },
  async login(id, pw) { return (await this.auth.signInWithEmailAndPassword(this.email(id), pw)).user; },
  async guest() { return (await this.auth.signInAnonymously()).user; },
  async bind(id, pw, mail) {
    const cred = firebase.auth.EmailAuthProvider.credential(this.email(id), pw);
    const res = await this.auth.currentUser.linkWithCredential(cred);
    await this.db.ref('users/' + res.user.uid + '/profile').set({ id, mail: mail || '', created: firebase.database.ServerValue.TIMESTAMP });
    this.user = res.user; return res.user;
  },
  async signOut() {
    this.flushSave();
    try { await this.setPond(0); if (this.meOnline) await this.meOnline.remove(); } catch (e) {}
    await this.auth.signOut();
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    location.reload();
  },
  errText(e) {
    const c = (e && e.code) || '';
    if (/email-already-in-use|credential-already-in-use/.test(c)) return '這個帳號已經有人使用了。';
    if (/wrong-password|invalid-credential|invalid-login|user-not-found|invalid-email/.test(c)) return '帳號或密碼錯誤。';
    if (/weak-password/.test(c)) return '密碼至少需要 6 個字元。';
    if (/too-many-requests/.test(c)) return '嘗試次數太多，請稍後再試。';
    if (/network/.test(c)) return '網路連線失敗，請檢查網路後再試。';
    if (/operation-not-allowed|admin-restricted/.test(c)) return '伺服器尚未開啟這種登入方式（請在 Firebase 啟用）。';
    return '發生錯誤：' + (c || (e && e.message) || '未知');
  },
  // ---------- session
  async start(user, fresh) {
    this.user = user; NET.uid = user.uid; NET.room = 'fire'; NET.db = 'fire';
    // cloud save wins; a brand-new account keeps progress made on this device
    let cloud = null;
    try { const snap = await this.db.ref('users/' + user.uid + '/save').get(); if (snap.exists()) cloud = parseSave(snap.val()); } catch (e) {}
    if (cloud) { S = Object.assign(freshSave(), cloud); if (S.today.date !== today()) S.today = { date: today(), list: [] }; }
    else if (fresh) S = Object.assign(freshSave(), fresh);
    if (user.isAnonymous && (!S.name || S.name === '神釣手')) S.name = '訪客' + user.uid.slice(-4);
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
    this.dirty = true; this.flushSave();
    this.listen(); this.announce(); NET.saveProfile();
    if (!user.isAnonymous && user.email) { const id = user.email.split('@')[0]; this.db.ref('ids/' + id).get().then(sn => { if (!sn.exists()) this.db.ref('ids/' + id).set(user.uid).catch(() => {}); }).catch(() => {}); }
  },
  listen() {
    if (this.listening) return; this.listening = true;
    this.joinT = this.now();
    const onl = this.db.ref('online');
    onl.on('value', s => { this.onlineMap = s.val() || {}; });
    this.db.ref('leaderboard').orderByChild('ep').limitToLast(50).on('value', s => {
      const arr = []; s.forEach(c => { arr.push({ id: c.key, ...c.val() }); }); arr.sort((a, b) => (b.ep || 0) - (a.ep || 0)); NET.board = arr;
    });
    this.db.ref('feed').orderByChild('t').limitToLast(8).on('child_added', s => {
      const v = s.val() || {}; if (v.uid === this.user.uid || !(v.t > this.joinT)) return;
      NET.onCatch({ sameTab: false, data: v });
    });
    this.db.ref('chat/world').orderByChild('t').limitToLast(30).on('child_added', s => { const v = s.val(); if (v) NET.onChat('world', v, v.t > this.joinT); });
    const me = this.user.uid;
    this.db.ref('friends/' + me).on('value', s => { NET.friends = s.val() || {}; });
    this.db.ref('requests/' + me).on('value', s => { NET.requests = s.val() || {}; });
    this.db.ref('gifts/' + me).on('child_added', s => this.claimGift(s));
  },
  // ---------- chat
  async sendChat(m, room) {
    if (!this.user) return false;
    const path = room === 'pond' ? (this.pondId ? 'p' + this.pondId : null) : 'world';
    if (!path) return false;
    const TS = firebase.database.ServerValue.TIMESTAMP, key = this.db.ref('chat/' + path).push().key;
    try {
      await this.db.ref().update({ ['chat/' + path + '/' + key]: { uid: this.user.uid, n: cleanName(S.name), m, t: TS }, ['chatT/' + this.user.uid]: TS });
      return true;
    } catch (e) { say('訊息送出失敗，請稍後再試'); return false; }
  },
  // ---------- friends & gifts
  async findId(id) {
    const sn = await this.db.ref('ids/' + id.toLowerCase()).get();
    return sn.exists() ? sn.val() : null;
  },
  async requestFriend(uid, name) {
    if (!this.user || uid === this.user.uid) return 'self';
    if (NET.friends[uid]) return 'already';
    const TS = firebase.database.ServerValue.TIMESTAMP;
    if (NET.requests[uid]) { await this.acceptFriend(uid, name || NET.requests[uid].n); return 'accepted'; }
    await this.db.ref('requests/' + uid + '/' + this.user.uid).set({ n: cleanName(S.name), t: TS });
    return 'sent';
  },
  async acceptFriend(uid, name) {
    const me = this.user.uid, TS = firebase.database.ServerValue.TIMESTAMP;
    await this.db.ref().update({ ['friends/' + me + '/' + uid]: { n: cleanName(name, '釣友'), t: TS }, ['friends/' + uid + '/' + me]: { n: cleanName(S.name), t: TS }, ['requests/' + me + '/' + uid]: null });
  },
  async declineFriend(uid) { await this.db.ref('requests/' + this.user.uid + '/' + uid).remove(); },
  async removeFriend(uid) { const me = this.user.uid; await this.db.ref().update({ ['friends/' + me + '/' + uid]: null, ['friends/' + uid + '/' + me]: null }); },
  async sendGift(uid, g) {
    const TS = firebase.database.ServerValue.TIMESTAMP, key = this.db.ref('gifts/' + uid).push().key;
    await this.db.ref().update({ ['gifts/' + uid + '/' + key]: { from: this.user.uid, n: cleanName(S.name), k: g.k, id: g.id || '', q: g.q | 0, t: TS }, ['giftT/' + this.user.uid]: TS });
  },
  claimGift(snap) {
    const g = snap.val(); if (!g) return;
    // remove first so a gift can never be counted twice, then add it to the save
    snap.ref.remove().then(() => { const msg = applyGift(g); if (msg) { NET.giftQ.push(msg); audio.coin(); } }).catch(() => {});
  },
  announce() {
    if (!this.user) return;
    this.meOnline = this.db.ref('online/' + this.user.uid);
    this.meOnline.onDisconnect().remove();
    this.lastOnline = ''; NET.lastJson = '';
    if (this.pondId) { this.mePond = this.db.ref('pond/' + this.pondId + '/' + this.user.uid); this.mePond.onDisconnect().remove(); }
  },
  setPresence(pr) {
    if (!this.user) return;
    const TS = firebase.database.ServerValue.TIMESTAMP;
    const sum = { n: pr.n, lv: pr.lv, p: pr.p, st: pr.st, g: this.user.isAnonymous ? 1 : 0 };
    const sj = JSON.stringify(sum);
    if (sj !== this.lastOnline && this.meOnline) { this.lastOnline = sj; this.meOnline.set({ ...sum, t: TS }).catch(() => {}); }
    if (pr.p !== this.pondId) this.setPond(pr.p);
    if (this.mePond) { const d = { ...pr, t: TS }; for (const k in d) if (d[k] === null) delete d[k]; this.mePond.set(d).catch(() => {}); }
  },
  async setPond(id) {
    if (this.mePond) { const r = this.mePond; this.mePond = null; try { r.onDisconnect().cancel(); await r.remove(); } catch (e) {} }
    if (this.pondRef) { this.pondRef.off(); this.pondRef = null; }
    if (this.chatRef) { this.chatRef.off(); this.chatRef = null; }
    this.pondMap = {}; this.pondId = id;
    if (!id || !this.user) return;
    this.pondRef = this.db.ref('pond/' + id);
    this.pondRef.on('value', s => this.onPond(s.val() || {}));
    NET.chat.pond = []; const t0 = this.now();
    this.chatRef = this.db.ref('chat/p' + id).orderByChild('t').limitToLast(30);
    this.chatRef.on('child_added', s => { const v = s.val(); if (v) NET.onChat('pond', v, v.t > t0 - 500); });
    this.mePond = this.db.ref('pond/' + id + '/' + this.user.uid);
    this.mePond.onDisconnect().remove();
  },
  onPond(map) {
    this.pondMap = map;
    for (const [uid, v] of Object.entries(map)) {
      if (uid === this.user.uid || !v || !Array.isArray(v.em)) continue;
      const stamp = +v.em[1] || 0;
      if (this.lastEm[uid] !== stamp) { this.lastEm[uid] = stamp; if (this.now() - stamp < 5000 && EMOTES[v.em[0] | 0]) NET.bubbles[uid] = { e: v.em[0] | 0, t: 0 }; }
    }
  },
  others() {
    if (!this.user) return [];
    const out = [];
    for (const [uid, v] of Object.entries(this.onlineMap)) {
      if (uid === this.user.uid || !v || typeof v.n !== 'string') continue;
      const detail = this.pondId && v.p === this.pondId && this.pondMap[uid] ? this.pondMap[uid] : {};
      out.push({ peer: uid, isMe: false, kind: 'viewer', guest: !!v.g, presence: { ...v, ...detail } });
    }
    return out;
  },
  pondPeers(id) {
    if (!this.user) return [];
    if (id === this.pondId) {
      return Object.entries(this.pondMap).filter(([uid, v]) => uid !== this.user.uid && v && typeof v.n === 'string')
        .map(([uid, v]) => ({ peer: uid, isMe: false, kind: 'viewer', guest: !!(this.onlineMap[uid] || {}).g, presence: v }))
        .sort((a, b) => a.peer < b.peer ? -1 : 1);
    }
    return this.others().filter(p => p.presence.p === id);
  },
  pushFeed(d) {
    if (!this.user) return;
    this.db.ref('feed').push({ uid: this.user.uid, n: cleanName(d.n), sp: d.sp, len: +d.len || 0, stars: d.stars | 0, p: d.p | 0, t: firebase.database.ServerValue.TIMESTAMP }).catch(() => {});
  },
  saveBoard(body) { if (this.user) this.db.ref('leaderboard/' + this.user.uid).set(body).catch(() => {}); },
  queueSave() {
    if (!this.user) return;
    this.dirty = true;
    if (!this.saveT) this.saveT = setTimeout(() => { this.saveT = null; this.flushSave(); }, 3000);
  },
  flushSave() {
    if (!this.user || !this.dirty) return;
    this.dirty = false;
    this.db.ref('users/' + this.user.uid + '/save').set(JSON.stringify(S)).catch(() => { this.dirty = true; });
  },
};

vec2 waves(vec2 g){

// Procedural caustic tile for the underwater camera
const CAUSTIC = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');

    const wx = xx + 11 * Math.sin(y * Math.PI * 2 / 128) + 5 * Math.sin(y * Math.PI * 2 / 64 + 1.3);
    const wy = y + 11 * Math.sin(xx * Math.PI * 2 / 128 + .7) + 5 * Math.sin(xx * Math.PI * 2 / 64);

    this.setState('cast'); audio.swish();
  },
  landCast() {
    const to = this.cast.to;

    }
    this.line.L = Math.hypot(to.x, to.z);
  },

  /* ----- waiting for a bite ----- */
  pickSpecies() {
    const bait = BAITS[S.equip.bait] || { likes: {} };
    const list = Object.entries(this.p.fish).map(([k, w]) => [k, w * (bait.likes[k] ?? .25)]);
    return weighted(list);
  },
  planApproach() {
    const bait = BAITS[S.equip.bait] || {}; const line = LINES[S.equip.line];

    const sp = this.pickSpecies();
    const ang = rnd(0, Math.PI * 2);
    this.approach = { sp, t: -delay, x: this.float.x + Math.cos(ang) * 3.2, z: this.float.z + Math.sin(ang) * 2.4 + 1, nibbles: rint(0, 3), phase: 'come', pt: 0, heading: 0, alpha: 0, biteT: 0 };

  updateWait(dt) {

    const a = this.approach; if (!a) return;
    a.t += dt;
    if (a.t < 0) return;
    const sp = FISH[a.sp];
    const fl = FLOATS[S.equip.float];
    const dx = f.x - a.x, dz = f.z - a.z, d = Math.hypot(dx, dz);
    a.alpha = Math.min(.55, a.alpha + dt * .3);

    } else if (a.phase === 'nibble') {
      a.pt += dt;
      a.x += (f.x - .12 + Math.sin(a.t * 5) * .05 - a.x) * dt * 2; a.z += (f.z + .18 - a.z) * dt * 2; a.spd = .25;
      if (a.pt > rnd(.6, 1.4)) {
        a.pt = 0;
        if (a.nibbles > 0) { a.nibbles--; f.dip = .35 * fl.warn; const pt = proj(f.x, f.z); water.ripple(pt.x, pt.y, .28); audio.tone(300, .05, 'sine', .08); }
        else { a.phase = 'bite'; a.biteT = 0; f.dip = 1; const pt = proj(f.x, f.z); water.ripple(pt.x, pt.y, .75); audio.bite(); this.banner = { k: 'get', t: 0 }; try { navigator.vibrate && navigator.vibrate(60); } catch (e) {} }
      }
    } else if (a.phase === 'bite') {
      a.biteT += dt; f.sink = Math.min(1, f.sink + dt * 4);
      if (a.biteT > .95 * fl.win) { a.phase = 'leave'; a.pt = 0; f.sink = 0; this.banner = null; say('魚吃掉餌溜走了…'); if (this.p.mode !== 'lure') { const pt = proj(f.x, f.z); water.ripple(pt.x, pt.y, .5); } }
    } else if (a.phase === 'leave') {

  strike() { // player taps 揚竿

    if (this.st === 'wait' && a && a.phase === 'nibble') { say('太早揚竿，魚被嚇跑了！'); }
    this.retrieve();
  },
  retrieve() {
    this.float = null; this.approach = null; this.lure = null; this.banner = null;
    audio.swish(); this.setState('idle');
  },

  /* ----- lure retrieve ----- */
  updateLure(dt) {
    const L = this.lure; if (!L) return;
    const bait = BAITS[S.equip.bait];
    const r = this.reel;
    const sp = r * 1.5 * this.rod().power;
    if (sp > 0) { const d = Math.hypot(L.x, L.z); L.x -= L.x / d * sp * dt; L.z -= L.z / d * sp * dt; }

      water.ripple(pt.x, pt.y, 1); this.addSplash(pt.x, pt.y, pt.f, 1); audio.splash(.7); audio.bite();
      this.banner = { k: 'get', t: 0 };
      this.hook(sp2, { x: L.x, z: L.z });
      return;
    }
    if (L.z < 1.2) { say('收線完成，再拋一次吧！'); this.retrieve(); }
  },

  /* ----- fight ----- */
  hook(spKey, at) {
    const sp = FISH[spKey];
    ensure(['anim:fight-' + spKey, 'anim:under-' + spKey, 'anim:land-' + spKey, 'anim:hang-' + spKey]);
    // size skewed toward small; rare trophies
    const r = Math.pow(Math.random(), 1.7);
    const len = Math.round(lerp(sp.min, sp.max, r) * 10) / 10;
    const size = (len - sp.min) / (sp.max - sp.min);
    const pos = at || (this.float ? { x: this.float.x, z: this.float.z } : { x: 0, z: 8 });
    this.fish = {
      sp: spKey, len, size, x: pos.x, z: pos.z, h: Math.PI / 2, life: 1, stam: 1, run: 0, runT: rnd(1, 3), turnT: 0,
      target: rnd(-Math.PI, Math.PI), anim: 0, thrash: 0, angry: 0, under: 0, dirFrame: 0, near: 0,

    this.power = 1;
    this.setState('hookset');
    this.view = 'under'; this.cine = 1.6; this.uv = null; this.sand = []; // the fight is shown under water (toggle 水上/水下)
    audio.splash(1);
  },
  updateFight(dt) {
    const F = this.fish, sp = FISH[F.sp], line = LINES[S.equip.line], rod = this.rod();
    // fish behaviour
    F.anim += dt * (6 + (F.spd || .6) * 9);
    F.turnT -= dt; F.runT -= dt; F.jumpCD = (F.jumpCD ?? rnd(2, 4)) - dt;
    if (F.runT <= 0 && F.run <= 0 && F.stam > .2) { F.run = rnd(1.2, 2.6) * (.6 + F.stam * .6); F.target = Math.atan2(rnd(.4, 1), rnd(-1, 1)) + (Math.random() < .5 ? 0 : rnd(-.8, .8)); F.angry = 1; audio.splash(.5 + F.size * .6); this.camShake = .4; }
    if (F.run > 0) { F.run -= dt; if (F.run <= 0) F.runT = rnd(2, 5) / (.5 + F.stam); }
    if (F.turnT <= 0 && F.run <= 0) { F.turnT = rnd(.8, 2.2); F.target = rnd(0, Math.PI * 2); }
    // steer: keep inside pond, prefer away from the dock
    if (F.z < 2.5) F.target = Math.PI / 2 + rnd(-.6, .6);
    if (Math.abs(F.x) > 7) F.target = Math.atan2(rnd(-.2, .5), -Math.sign(F.x));
    let dh = F.target - F.h; dh = Math.atan2(Math.sin(dh), Math.cos(dh));
    F.h += clamp(dh, -dt * 2.4, dt * 2.4);
    const spd = sp.speed * (F.run > 0 ? 2.1 : .7) * (.3 + .7 * F.stam) * (.3 + .7 * F.life);
    F.spd = spd;
    // depth: dives on runs, rises as it tires
    const wantDepth = F.run > 0 ? .8 : F.life < .3 ? .02 : .35 + .2 * Math.sin(this.t * .7);
    F.depth = lerp(F.depth ?? .5, wantDepth, clamp(dt * .9, 0, 1));
    // surface wake when it races near the top

    // jumpers leap clear of the water on a run; the rest thrash on top when tired

      F.jumpCD = rnd(4, 8);
      this.spray(pt0.x, pt0.y, 14 + F.size * 16, pt0.f * 2.4); water.ripple(pt0.x, pt0.y, 1); audio.splash(.8 + F.size * .5);
    }

    const pump = this.pump && this.power > .02;

    const Fp = F.force * (F.run > 0 ? 1.7 : 1) * (.35 + .65 * F.stam) * (.4 + .6 * F.life);
    const R = this.reel * .5 * rod.power * (pump ? 1.6 : 1);

    this.line.T = lerp(this.line.T, Traw, clamp(dt * 9, 0, 1));

    const T = this.line.T;

    this.power = clamp(this.power + (pump ? -dt * .38 : dt * .14), 0, 1);
    F.angry = Math.max(0, F.angry - dt * .6);

    if (F.thrash <= 0) {
      F.thrash = rnd(.25, .9) / (.3 + F.stam); const pt = proj(F.x, F.z);

    if (this.line.L < 1.25) this.land();
  },
  lose(why) {
    this.setState('lost'); this.loseWhy = why; this.view = 'surface';
    if (why === 'broken') { audio.snap(); if (this.isLure()) { const i = S.owned.lure.indexOf(S.equip.bait); if (i >= 0) { S.owned.lure.splice(i, 1); say('假餌隨斷線遺失了。'); } } }
    else audio.lose();
    try { navigator.vibrate && navigator.vibrate([40, 40, 80]); } catch (e) {}
    save();
  },
  land() { this.setState('land'); this.view = 'surface'; audio.splash(1.1); },

  /* ----- input / controls ----- */
  readControls(dt) {
    // reel wheel: rotate the handle around the reel (clockwise), hold to auto-reel, or keyboard
    const cx = 360, cy = 1130, R = 118;
    const w = this.wheel; let rate = 0;
    const onWheel = ACTIVE_LAYER === 0 && P.down && P.cap === 'wheel';
    if (ACTIVE_LAYER === 0 && P.justDown && Math.hypot(P.dx - cx, P.dy - cy) < R + 30 && Math.hypot(P.dx - cx, P.dy - cy) > 52) P.cap = 'wheel';
    if (onWheel) {
      const a = Math.atan2(P.y - cy, P.x - cx);
      if (w.last !== null) { let da = a - w.last; da = Math.atan2(Math.sin(da), Math.cos(da)); if (da > 0) { w.spin += da; w.ang += da; } else w.ang += da * .2; }
      w.last = a; w.hold += dt;
    } else { w.last = null; w.hold = 0; }
    w.vel = lerp(w.vel || 0, w.spin / Math.max(dt, .001), clamp(dt * 8, 0, 1)); w.spin = 0;
    rate = clamp(w.vel / (Math.PI * 2 * 1.6), 0, 1);
    if (onWheel && w.hold > .2 && rate < .5) rate = Math.max(rate, .55);
    if (keys.Space || keys.ArrowDown || keys.KeyS) { rate = Math.max(rate, .75); w.ang += dt * 7; }
    if (!onWheel && rate > 0) w.ang += rate * dt * 9;
    this.reel = rate;
    const pumpHeld = (ACTIVE_LAYER === 0 && P.down && P.cap === 'pump') || keys.ShiftLeft || keys.ShiftRight || keys.ArrowUp || keys.KeyW;
    this.pump = !!pumpHeld;
  },

  update(dt) {
    this.t += dt; this.stT += dt;
    this.updateDock(dt);
    this.camShake = Math.max(0, this.camShake - dt);
    if (this.banner) { this.banner.t += dt; if (this.banner.t > 1.4) this.banner = null; }
    // ambient fish
    for (const s of this.shadows) { s.age += dt; s.h += Math.sin(this.t * .3 + s.z) * dt * .2; s.x += Math.cos(s.h) * s.v * dt; s.z += Math.sin(s.h) * s.v * dt; }
    this.shadows = this.shadows.filter(s => s.age < s.life && s.z > 2);
    for (const s of this.splashes) s.t += dt;
    this.splashes = this.splashes.filter(s => s.t < 1.3);
    for (const d of this.drops) { d.t += dt; d.vy += 1300 * dt; d.x += d.vx * dt; d.y += d.vy * dt; if (d.y > d.floor && d.vy > 0) { d.dead = true; if (Math.random() < .08) water.ripple(d.x, d.floor, .08); } }
    this.drops = this.drops.filter(d => !d.dead && d.t < 2);
    const sc = this.school;
    if (sc) {
      sc.h += Math.sin(this.t * .23) * dt * .35;
      if (sc.cz < 4 || sc.cz > 15 || Math.abs(sc.cx) > 6) sc.h = Math.atan2(10 - sc.cz, -sc.cx);
      sc.cx += Math.cos(sc.h) * .35 * dt; sc.cz += Math.sin(sc.h) * .35 * dt;
      // scatter when a hooked fish thrashes nearby
      if (this.fish && Math.hypot(this.fish.x - sc.cx, this.fish.z - sc.cz) < 2.5) { sc.h = Math.atan2(sc.cz - this.fish.z, sc.cx - this.fish.x); sc.cx += Math.cos(sc.h) * 1.4 * dt; sc.cz += Math.sin(sc.h) * 1.4 * dt; }
    }
    if (Math.random() < dt * .18) { const z = rnd(4, 18), x = rnd(-5, 5), pt = proj(x, z); water.ripple(pt.x, pt.y, rnd(.12, .28)); }
    this.friendRipples(dt);

    const st = this.st;
    if (st === 'aim') {
      if (this.charging) this.charge = .5 - .5 * Math.cos(this.stT * 3.2);
    }
    if (st === 'cast') {
      this.cast.t += dt;
      if (this.cast.t >= this.cast.dur) this.landCast();
    }
    if (st === 'wait') this.updateWait(dt);
    if (st === 'lure' || st === 'hookset' || st === 'fight') this.readControls(dt);
    else { this.reel = 0; this.pump = false; }
    if (st === 'lure') this.updateLure(dt);
    if (st === 'hookset') {
      this.cine -= dt;
      if (this.cine <= 0) { this.view = S.uw === false ? 'surface' : 'under'; this.setState('fight'); }
      else this.updateFight(dt * .5);
    }
    if (st === 'fight') this.updateFight(dt);
    if (st === 'lost' && this.stT > 2.2) { this.fish = null; this.setState('idle'); }
    if (st === 'land' && this.stT > 2.6) this.finishCatch();
  },
  finishCatch() {
    const F = this.fish; const sp = FISH[F.sp];
    const kg = Math.round(sp.wk * Math.pow(F.len, 3) / 1000 * 100) / 100;
    const stars = F.size < .2 ? 1 : F.size < .45 ? 2 : F.size < .7 ? 3 : F.size < .9 ? 4 : 5;
    const silver = Math.round(sp.value * (.6 + 1.6 * F.size) * this.bet * (1 + (stars - 1) * .15));
    const gold = stars >= 5 ? rint(1, 3) : (stars >= 4 && Math.random() < .3 ? 1 : 0);
    const ep = Math.round(sp.value * (1 + F.size) * 1.5 + 4);
    const rec = S.records[F.sp] || 0;
    const result = { sp: F.sp, len: F.len, kg, stars, silver, gold, ep, record: Math.max(rec, F.len), newRecord: F.len > rec, pond: this.p.id };
    this.fish = null; this.setState('idle');
    go(catchScene, result);
  },
  addSplash(x, y, s, a = 1) { this.splashes.push({ x: x + water.cam * depthF(y), y, s, a, t: 0 }); },
  spray(x, y, n, k = 1) { // water droplets thrown up by a splash
    for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + rnd(-1.1, 1.1); const v = rnd(160, 520) * k * .5; this.drops.push({ x: x + rnd(-6, 6) * k, y, vx: Math.cos(a) * v * .7, vy: Math.sin(a) * v, r: rnd(1, 3) * k * .6, t: 0, floor: y + rnd(-2, 6), cam: water.cam }); }
  },

  /* ----- drawing ----- */
  draw() {
    const p = this.p;
    const shake = this.camShake > 0 ? (Math.random() - .5) * this.camShake * 8 : 0;
    if (this.view === 'under') { this.drawUnder(); return; }
    this.drawUW();
    ctx.save(); ctx.translate(shake, 0);
    // water via WebGL underneath; if unavailable draw the plain texture
    const wrote = water.render(this.t, DTF, { sunX: 470 + Math.sin(this.t * .05) * 30, sun: .7, calm: this.st === 'fight' ? 1.15 : 1 });
    const camPx = this.camW * 300;
    if (!wrote) this.tiled(p.bgKey + '-bg-water', WATER_Y, LH - WATER_Y, camPx * .6);

function giftLabel(g) {

  if (g.k === 'bait') return `${g.id} ×${g.q}`;
  const tbl = { rod: RODS, line: LINES, float: FLOATS }[g.k];
  if (tbl) return tbl[g.id] ? tbl[g.id].name : '裝備';
  if (g.k === 'lure') return g.id + '（假餌）';
  return '禮物';
}

        text(`今天還能送 ${Math.max(0, left)} 次`, 360, 830, { size: 20, weight: 700, align: 'center', color: 'rgba(255,255,255,.8)' });
        if (textBtn('gsend', m.busy ? '送出中…' : '送出禮物', 360, 905, 240, 66, { layer: 1, size: 28, colors: ['#ff9ad0', '#d0408a'], edge: '#6a1040' }).click) m.send(it, left);
        if (m.msg) text(m.msg, 360, 990, { size: 22, weight: 900, align: 'center', color: '#fff', stroke: '#3a1a06', sw: 5 });
      });
      if (btn('gclose', 'fishing/POP-catch/button-close', 672, 190, { s: .72, layer: 1 }).click) closeModal(m);
    },
    async send(it, left) {
      if (m.busy) return;
      if (!it) { m.msg = '請先選一樣禮物'; return; }
      if (left <= 0) { m.msg = '今天的送禮次數用完了，明天再來！'; return; }
      if (!NET.friends[uid]) { m.msg = '只能送禮給好友'; return; }
      const q = it.max > 1 ? m.qty : 1;
      if (q <= 0 || q > it.max) { m.msg = '數量不足'; return; }
      // take the gift out of the bag first; put it back if sending fails
      const undo = () => {
        if (it.k === 'silver') S.silver += q; else if (it.k === 'gold') S.gold += q; else if (it.k === 'bait') S.bait[it.id] = (S.bait[it.id] || 0) + q;
        else if (it.k === 'lure') S.owned.lure.push(it.id); else S.owned[it.k].push(it.id);
      };
      if (it.k === 'silver') S.silver -= q; else if (it.k === 'gold') S.gold -= q; else if (it.k === 'bait') S.bait[it.id] -= q;
      else { const arr = it.k === 'lure' ? S.owned.lure : S.owned[it.k]; const i = arr.indexOf(it.id); if (i < 0) { m.msg = '找不到這個裝備'; return; } arr.splice(i, 1); }
      m.busy = true;
      try {
        await FB.sendGift(uid, { k: it.k, id: it.id || '', q });
        giftsToday(); S.gifts.n++; save(); audio.coin();
        m.msg = `已送出「${giftLabel({ k: it.k, id: it.id, q })}」！`; m.sel = null;
      } catch (e) { undo(); save(); m.msg = '送出失敗（送太快或對方還不是好友），請稍後再試'; }
      m.busy = false;
    },
  };
  return m;
}
function missionsModal() {
  const goals = [['今天釣到 3 條魚', S.today.list.length, 3], ['今天釣到 10 條魚', S.today.list.length, 10], ['釣到 4 星以上的魚', S.today.list.filter(i => i.stars >= 4).length, 1], ['集滿 6 種魚', Object.keys(S.records).length, 6]];
  const msg = goals.map(([g, v, n]) => `${v >= n ? '✔' : '・'} ${g}（${Math.min(v, n)}/${n}）`).join('\n');
  return messageModal(msg, '任務');
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let last = performance.now(), DTF = 1 / 60;
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; DTF = dt; T += dt;
  ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.clearRect(0, 0, LW, LH);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ACTIVE_LAYER = modals.length ? 1 : 0;
  if (toast.t > 0) toast.t -= dt;
  NET.update(dt);
  if (scene) {
    LAYER = 0;
    if (!modals.length || scene !== pond) scene.update(dt);
    else if (scene === pond && !['idle', 'aim'].includes(pond.st)) scene.update(dt); // a fish keeps fighting behind a popup
    scene.draw();
  }
  if (scene && scene !== titleScene) NET.drawFeed();
  LAYER = 1;
  for (const m of modals) { m.t += dt; }
  FIELD_USE.chatIn = FIELD_USE.fidIn = false;
  if (modals.length) modals[modals.length - 1].draw();
  if (!FIELD_USE.chatIn && chatIn.style.display !== 'none') { chatIn.style.display = 'none'; chatIn.blur(); }
  if (!FIELD_USE.fidIn && fidIn.style.display !== 'none') { fidIn.style.display = 'none'; fidIn.blur(); }
  if (loading.on) {
    dim(.6);
    text(loading.msg, 360, 600, { size: 32, align: 'center', weight: 900, color: '#fff' });
    roundRect(160, 650, 400, 18, 9); ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fill();
    roundRect(160, 650, 400 * loading.p, 18, 9); ctx.fillStyle = '#8ff1ff'; ctx.fill();
  }
  // scene fade
  if (fadeDir) {
    fade = clamp(fade + dt * 3.2 * fadeDir, 0, 1);
    if (fade >= 1 && nextScene) {
      if (scene && scene.exit) scene.exit();
      const [sc, arg] = nextScene; nextScene = null; scene = sc; modals.length = 0; nickEl.style.display = 'none'; sc.enter(arg); fadeDir = -1;
    }
    if (fade <= 0 && fadeDir === -1) fadeDir = 0;
  }
  if (fade > 0) { ctx.fillStyle = `rgba(3,14,16,${fade})`; ctx.fillRect(0, 0, LW, LH); }
  P.justDown = false; P.justUp = false;
  if (!P.down && P.cap && !P.justUp) P.cap = null;
  requestAnimationFrame(loop);
}

/* ---------------- boot ---------------- */
(async function boot() {
  load(); resize();
  try { A.man = await (await fetch('assets.json')).json(); }
  catch (e) { bootEl.textContent = '素材讀取失敗，請重新整理頁面。'; return; }
  water.init();
  NET.init();
  await ensure(['img:cover-bg', 'atlas:0', 'atlas:1', 'atlas:2', 'atlas:3', 'anim:loadreel']);
  bootEl.hidden = true;
  scene = titleScene; titleScene.enter();
  requestAnimationFrame(t => { last = t; loop(t); });
  const first = ['img:lobby-map', 'img:lobby-bg-cloud1', 'img:lobby-bg-cloud2', 'img:lobby-bg-cloud3', 'anim:bird', 'anim:missionfx', ...A.man.atlas.map((_, i) => 'atlas:' + i), 'img:pond1-bg-water', 'img:pond1-bg-top', 'img:pond1-wood-grass', 'img:girl-idle', 'img:girl-fight', 'img:girl-shadow', ...charAssets(S.char), 'img:boy-head'];
  await ensureProgress(first, v => titleScene.p = v);
  try { await document.fonts.ready; } catch (e) {}
  titleScene.ready = true;
})();
</script>
