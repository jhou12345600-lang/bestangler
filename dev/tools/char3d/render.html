<!doctype html>
<html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<style>html,body{margin:0;background:transparent}</style>
</head><body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

window.R = { THREE, renderer, scene, model: null, bones: {}, cam: null, extras: [] };

window.setup = async (opts) => {
  let m;
  if (/\.fbx$/i.test(opts.model)) {
    m = await new FBXLoader().loadAsync(opts.model);
    const tl = new THREE.TextureLoader(), base = opts.model.replace(/[^/]+$/, '');
    const T = async (n, srgb) => { const t = await tl.loadAsync(base + n); t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace; t.flipY = true; t.anisotropy = 8; return t; };
    const p = opts.prefix;
    const [bc, bn, hc, hn, oc] = await Promise.all([T(p + '_body_color.png', 1), T(p + '_body_normal.png'), T(p + '_head_color.png', 1), T(p + '_head_normal.png'), T(p + '_opacity_color.png', 1)]);
    R.matInfo = [];
    m.traverse(o => {
      if (!o.isMesh) return;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      const out = mats.map(mt => {
        const n = (mt.name || '');
        R.matInfo.push([o.name, mt.name, mt.map ? mt.map.name : null, mt.transparent]);
        if (/opacity|hair|lash|brow/i.test(n)) return new THREE.MeshStandardMaterial({ map: oc, transparent: true, alphaTest: 0.35, side: THREE.DoubleSide, roughness: .75 });
        if (/head/i.test(n)) return new THREE.MeshStandardMaterial({ map: hc, normalMap: hn, roughness: .62 });
        return new THREE.MeshStandardMaterial({ map: bc, normalMap: bn, roughness: .82 });
      });
      o.material = Array.isArray(o.material) ? out : out[0];
    });
  } else {
    const gltf = await new GLTFLoader().loadAsync(opts.model);
    m = gltf.scene; R.gltf = gltf;
  }
  R.model = m;
  m.traverse(o => {
    if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; }
    if (o.isBone) R.bones[o.name.replace('mixamorig', '').replace(/^Bip01[ _]/, '')] = o;
  });
  // only show the highest level of detail
  if (opts.lod) m.traverse(o => { if (o.isMesh && !new RegExp(opts.lod, 'i').test(o.name)) o.visible = false; });
  scene.add(m);
  // lights: sun ahead of the angler (we look at their back), sky fill, warm bounce from the dock
  const sun = new THREE.DirectionalLight(0xfff1dc, 2.2); sun.position.set(1.5, 4, -5); scene.add(sun);
  const back = new THREE.DirectionalLight(0xdcefff, 1.15); back.position.set(-2, 3, 5); scene.add(back);
  const hemi = new THREE.HemisphereLight(0xbfe3ff, 0x8a6a40, 0.9); scene.add(hemi);
  return Object.keys(R.bones);
};

// pose helper: euler degrees per bone, applied on top of bind pose
window.pose = (p) => {
  for (const [name, e] of Object.entries(p)) {
    const b = R.bones[name]; if (!b) continue;
    if (!b.userData.q0) b.userData.q0 = b.quaternion.clone();
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(e[0] * Math.PI / 180, e[1] * Math.PI / 180, e[2] * Math.PI / 180, 'XYZ'));
    b.quaternion.copy(b.userData.q0).multiply(q);
  }
  R.model.updateMatrixWorld(true);
};
// a canvas bucket hat, placed in world space over the head then parented to the head bone
window.addHat = (o = {}) => {
  if (R.hat) { R.hat.parent.remove(R.hat); R.hat = null; }
  R.model.updateMatrixWorld(true);
  const head = R.bones.Head; const hp = new THREE.Vector3();
  // skull: posed vertices in the top 22 cm of the body -> centroid in x/z, max y
  let mesh = null; R.model.traverse(x => { if (x.isSkinnedMesh) mesh = x; });
  const v = new THREE.Vector3(); let top = -1e9; const pts0 = [];
  const n = mesh.geometry.attributes.position.count;
  for (let i = 0; i < n; i += 3) { mesh.getVertexPosition(i, v); v.applyMatrix4(mesh.matrixWorld); pts0.push(v.clone()); if (v.y > top) top = v.y; }
  const sk = pts0.filter(p => p.y > top - 14);
  hp.set(sk.reduce((a, p) => a + p.x, 0) / sk.length, top, sk.reduce((a, p) => a + p.z, 0) / sk.length);
  R.headTop = hp.toArray();
  const s = o.scale || 1;
  const pts = [[0, 13.5], [6.5, 13.1], [9.4, 11.8], [10.4, 6], [10.8, 2], [11.3, 1.2], [13.8, -0.6], [15.2, -1.5], [15.3, -2.1], [13.6, -1.4], [11, 0.2], [10.6, 0.2]].map(([x, y]) => new THREE.Vector2(x * s, y * s));
  const geo = new THREE.LatheGeometry(pts, 48);
  const tex = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
    x.fillStyle = o.color || '#b9a57c'; x.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 4000; i++) { x.fillStyle = `rgba(${Math.random() < .5 ? '255,255,255' : '40,30,10'},${Math.random() * .06})`; x.fillRect(Math.random() * 256, Math.random() * 256, 2, 2); }
    x.strokeStyle = 'rgba(60,45,20,.25)'; for (let y = 0; y < 256; y += 3) { x.beginPath(); x.moveTo(0, y); x.lineTo(256, y); x.stroke(); }
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(4, 2); return t; })();
  const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: .95, side: THREE.DoubleSide });
  const hat = new THREE.Mesh(geo, mat); hat.castShadow = true;
  const band = new THREE.Mesh(new THREE.CylinderGeometry(10.62 * s, 10.95 * s, 2.4 * s, 48, 1, true), new THREE.MeshStandardMaterial({ color: o.band || '#3d3a2c', roughness: .8, side: THREE.DoubleSide }));
  band.position.y = 3.4 * s; hat.add(band);
  hat.position.set(hp.x + (o.dx || 0), hp.y + (o.dy || 0), hp.z + (o.dz || 0));
  hat.rotation.set((o.tilt || 0) * Math.PI / 180, 0, (o.roll || 0) * Math.PI / 180);
  R.model.add(hat); R.model.updateMatrixWorld(true);
  head.attach(hat); R.hat = hat;
};
// a fish lip-gripper held in the right hand (handle up, jaw down)
window.addGripper = () => {
  if (R.grip) { R.grip.parent.remove(R.grip); R.grip = null; }
  R.model.updateMatrixWorld(true);
  const hand = R.bones.R_Hand; const hp = new THREE.Vector3(); hand.getWorldPosition(hp);
  const g = new THREE.Group();
  const dark = new THREE.MeshStandardMaterial({ color: 0x1c1d20, roughness: .45, metalness: .2 });
  const steel = new THREE.MeshStandardMaterial({ color: 0xc9ced4, roughness: .25, metalness: .9 });
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.7, 13, 20), dark); handle.position.y = 2; g.add(handle);
  const cap = new THREE.Mesh(new THREE.TorusGeometry(2.2, .45, 10, 24), steel); cap.position.y = 9.5; g.add(cap);
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(.55, .55, 7, 12), steel); rod.position.y = -8; g.add(rod);
  const jaw = new THREE.Mesh(new THREE.TorusGeometry(2.4, .55, 10, 24, Math.PI * 1.6), steel); jaw.position.y = -13.5; jaw.rotation.z = Math.PI * .7; g.add(jaw);
  const tip = new THREE.Object3D(); tip.position.y = -16; g.add(tip); R.gripTip = tip;
  g.position.copy(hp); g.position.y -= 2; g.position.z += 4;
  R.model.add(g); R.model.updateMatrixWorld(true); hand.attach(g); R.grip = g;
};
window.objScreen = (obj, w, h) => { const v = new THREE.Vector3(); obj.getWorldPosition(v); v.project(R.cam); return [(v.x * 0.5 + 0.5) * w, (-v.y * 0.5 + 0.5) * h]; };
window.resetPose = () => { for (const b of Object.values(R.bones)) if (b.userData.q0) b.quaternion.copy(b.userData.q0); R.model.updateMatrixWorld(true); };

// camera: w x h pixels, looking from (az degrees around Y, el degrees up), framing the box
window.shoot = (o) => {
  renderer.setSize(o.w, o.h, false);
  const box = new THREE.Box3().setFromObject(R.model);
  const c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
  const dist = o.dist || 9;
  const cam = new THREE.PerspectiveCamera(o.fov || 18, o.w / o.h, dist / 100, dist * 4);
  const az = (o.az || 0) * Math.PI / 180, el = (o.el || 0) * Math.PI / 180;
  const target = new THREE.Vector3(c.x, box.min.y + sz.y * (o.ty ?? 0.5), c.z);
  cam.position.set(target.x + Math.sin(az) * Math.cos(el) * dist, target.y + Math.sin(el) * dist, target.z + Math.cos(az) * Math.cos(el) * dist);
  cam.lookAt(target);
  R.cam = cam;
  renderer.render(scene, cam);
  return canvas.toDataURL('image/png');
};
// screen position of a bone in the last shot (pixels)
window.boneScreen = (name, w, h) => {
  const b = R.bones[name]; const v = new THREE.Vector3(); b.getWorldPosition(v); v.project(R.cam);
  return [(v.x * 0.5 + 0.5) * w, (-v.y * 0.5 + 0.5) * h];
};

// ---- fishing rod and landing net built in world space each frame (cm units; +Y up, +Z toward the water, -X = screen right)
const V3 = (a) => new THREE.Vector3(a[0], a[1], a[2]);
function clearObj(k) { if (R[k]) { R[k].parent.remove(R[k]); R[k].traverse(o => { if (o.geometry) o.geometry.dispose(); }); R[k] = null; } }
function seg(a, b, r0, r1, mat, grp) {
  const d = new THREE.Vector3().subVectors(b, a), L = d.length(); if (L < 1e-4) return;
  const g = new THREE.CylinderGeometry(r1, r0, L, 10, 1, false); const m = new THREE.Mesh(g, mat);
  m.position.copy(a).addScaledVector(d, .5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()); m.castShadow = true; grp.add(m);
}
window.handPos = (side) => { const h = R.bones[side + '_Hand'], f = R.bones[side + '_Forearm']; R.model.updateMatrixWorld(true);
  const a = new THREE.Vector3(), b = new THREE.Vector3(); h.getWorldPosition(a); f.getWorldPosition(b);
  return a.clone().addScaledVector(a.clone().sub(b).normalize(), 6); };
window.setRod = (o) => {
  clearObj('rod'); R.rodTip = null; if (!o) return;
  const grp = new THREE.Group(); const hp = handPos('R');
  const d = V3(o.dir).normalize(), bd = V3(o.bend || [0, 0, 1]).normalize(), L = o.len, k = o.k || 0;
  const N = 28, pts = [];
  for (let i = 0; i <= N; i++) { const u = i / N * 1.14 - .14; const uu = Math.max(0, u); pts.push(hp.clone().addScaledVector(d, L * u).addScaledVector(bd, k * L * uu * uu)); }
  // keep the length roughly constant as it bends
  const st = o.style || 'pole';
  const C = { pole: ['#1b1a18', '#b31c1c', '#141414', '#d8b04a'], cast: ['#1b1a18', '#2f9a3a', '#3a3f44', '#c9ced4'], lure: ['#1b1a18', '#2a4d8f', '#20252c', '#c9ced4'] }[st];
  const mats = C.map(c => new THREE.MeshStandardMaterial({ color: c, roughness: .35, metalness: .25 }));
  for (let i = 0; i < N; i++) {
    const u = i / N, r0 = THREE.MathUtils.lerp(1.25, .22, Math.pow(u, .8)), r1 = THREE.MathUtils.lerp(1.25, .22, Math.pow((i + 1) / N, .8));
    const mat = u < .2 ? mats[0] : (u < .24 ? mats[3] : (Math.floor(u * 11) % 3 === 0 ? mats[2] : mats[1]));
    seg(pts[i], pts[i + 1], r0, r1, mat, grp);
  }
  if (st !== 'pole') { const reel = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, 3, 18), mats[3]); reel.position.copy(pts[4]).add(new THREE.Vector3(0, -3.5, 0)); reel.rotation.z = Math.PI / 2; grp.add(reel); }
  R.scene.add(grp); R.rod = grp; R.rodTip = pts[N].toArray();
};
window.setNet = (o) => {
  clearObj('net'); R.netTop = null; if (!o) return;
  const grp = new THREE.Group(); const hp = handPos('L'); const d = V3(o.dir).normalize();
  const steel = new THREE.MeshStandardMaterial({ color: '#d9dde2', roughness: .3, metalness: .7 });
  const a = hp.clone().addScaledVector(d, -12), b = hp.clone().addScaledVector(d, o.len);
  seg(a, b, 1.3, 1.1, steel, grp);
  const rr = o.r || 20, c = b.clone().addScaledVector(d, rr * .9);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(rr, .9, 8, 32), steel);
  ring.position.copy(c); ring.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), V3(o.normal || [0, 1, 0]).normalize()); grp.add(ring);
  const bag = new THREE.Mesh(new THREE.ConeGeometry(rr, o.depth || 34, 24, 1, true), new THREE.MeshStandardMaterial({ color: '#1f7a2c', roughness: .9, side: THREE.DoubleSide, transparent: true, opacity: .93 }));
  const nrm = V3(o.normal || [0, 1, 0]).normalize();
  bag.position.copy(c).addScaledVector(nrm, -(o.depth || 34) / 2); bag.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), nrm.clone().negate()); grp.add(bag);
  R.scene.add(grp); R.net = grp; R.netC = c.toArray(); R.netTop = c.clone().add(new THREE.Vector3(0, rr * .25, 0)).toArray();
};
window.ptScreen = (p, w, h) => { const v = V3(p).project(R.cam); return [(v.x * .5 + .5) * w, (-v.y * .5 + .5) * h]; };
window.shootFix = (o) => {
  const T = THREE; renderer.setSize(o.w, o.h, false);
  if (!R.fixC) { const box = new T.Box3().setFromObject(R.model); R.fixC = box.getCenter(new T.Vector3()); R.fixMin = box.min.y; }
  const cam = new T.PerspectiveCamera(o.fov, o.w / o.h, 10, 5000); const az = o.az * Math.PI / 180, el = o.el * Math.PI / 180, d = o.dist;
  const tg = new T.Vector3(R.fixC.x, R.fixMin + o.ty, R.fixC.z);
  cam.position.set(tg.x + Math.sin(az) * Math.cos(el) * d, tg.y + Math.sin(el) * d, tg.z + Math.cos(az) * Math.cos(el) * d); cam.lookAt(tg); R.cam = cam;
  renderer.render(scene, cam); return canvas.toDataURL('image/png');
};
window.feetScreen = (w, h) => ptScreen([R.fixC.x, R.fixMin, R.fixC.z], w, h);

window.ready = true;
</script>
</body></html>
